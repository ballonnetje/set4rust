[package]
name = "s4-game"
version = "0.2.3"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
kira = { version = "=0.12.5", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis"] }
arc-swap = "1"
s4-audio = { path = "../s4-audio" }
s4-formats = { path = "../s4-formats" }
s4-mapgen = { path = "../s4-mapgen" }
s4-script = { path = "../s4-script" }
s4-net = { path = "../s4-net" }
s4-sim = { path = "../s4-sim", features = ["serde"] }
bincode = "1.3"
flate2 = "1"
s4-viewer = { path = "../s4-viewer" }
s4-video = { path = "../s4-video" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
winit = "0.30"
# The monitor overlay (monitor/): ours, not the original GUI; on the game's wgpu device.
egui = { version = "0.32", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.32", default-features = false }
egui-winit = { version = "0.32", default-features = false }

[features]
# The packaged build (tools/package): a Windows-subsystem exe, no console window (main.rs, console.rs).
package = []

[target.'cfg(windows)'.dependencies]
# The monitor's work area for the plain window (the version winit already uses).
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
# The internet screens' tests run a relay of their own.
s4-relay = { path = "../s4-relay" }
